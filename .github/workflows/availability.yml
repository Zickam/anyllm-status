name: ANY LLM availability

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/availability.yml
      - check_site.py
      - record_status.py

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: probe
        name: Check HTML, JavaScript and backend readiness
        run: python3 check_site.py
      - name: Record daily status and state changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_OK: ${{ steps.probe.outcome == 'success' }}
        run: python3 record_status.py
