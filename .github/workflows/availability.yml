name: ANY LLM availability

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      notification_test:
        description: Create and close a test notification issue
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/availability.yml
      - check_site.py
      - record_status.py
      - notify.py

permissions:
  contents: write
  issues: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: probe
        name: Check HTML, JavaScript and backend readiness
        run: python3 check_site.py
      - name: Record daily status and state changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_OK: ${{ steps.probe.outcome == 'success' }}
        run: python3 record_status.py
      - name: Notify about availability changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_OK: ${{ steps.probe.outcome == 'success' }}
          PROBE_RESULTS: ${{ steps.probe.outputs.results }}
        run: python3 notify.py
      - name: Test notification delivery after monitor changes
        if: github.event_name == 'push' || inputs.notification_test == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 notify.py --test
